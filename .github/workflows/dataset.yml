# Keeps the static dataset on the gh-pages branch up to date (served by GitHub Pages).
# The SQLite database travels between runs in the Actions cache; if the cache is gone,
# the sync starts from scratch and downloads the whole history again (~30 seconds).
name: dataset

on:
  schedule:
    - cron: "15 12,16,20,23 * * *" # 09:15, 13:15, 17:15 and 20:15 in Asunción (UTC-3)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download the whole BCP history"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build -o cotiza ./cmd/cotiza

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: cotiza.db
          key: cotiza-db-${{ github.run_id }}
          restore-keys: cotiza-db-

      - name: Sync
        run: ./cotiza sync --quiet ${{ inputs.full && '--full' || '' }}

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: cotiza.db
          key: cotiza-db-${{ github.run_id }}

      - name: Check out gh-pages
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git worktree add site FETCH_HEAD
            git -C site switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Export
        run: ./cotiza export --dir site

      - name: Publish
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: $(TZ=America/Asuncion date +%F\ %H:%M)"
          git push origin gh-pages
