# Keeps the demo page on GitHub Pages up to date: only the table of latest rates, not the data files.
# The SQLite database travels between runs in the Actions cache; if the cache is gone,
# the sync starts from scratch and downloads the whole history again (~30 seconds).
name: dataset

on:
  schedule:
    - cron: "15 12,16,20,23 * * *" # 09:15, 13:15, 17:15 and 20:15 in Asunción (UTC-3)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download the whole BCP history"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first-deploy.outputs.page_url || steps.retry-deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build -o cotiza ./cmd/cotiza

      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: cotiza.db
          key: cotiza-db-${{ github.run_id }}
          restore-keys: cotiza-db-

      - name: Sync DNIT
        run: ./cotiza sync --quiet --source set

      # The page only lists DNIT currencies, so a BCP outage must not block publishing.
      # Since 2026-11-06 bcp.gov.py answers 403 behind a Cloudflare challenge.
      - name: Sync BCP
        continue-on-error: true
        run: ./cotiza sync --quiet --source bcp ${{ inputs.full && '--full' || '' }}

      - name: Save database
        uses: actions/cache/save@v6
        with:
          path: cotiza.db
          key: cotiza-db-${{ github.run_id }}

      - name: Export
        run: ./cotiza export --page-only --dir site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # The artifact API sometimes lags behind the upload and deploy-pages finds 0 artifacts.
      - id: first-deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.first-deploy.outcome == 'failure'
        run: sleep 30

      - id: retry-deploy
        if: steps.first-deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
