# Keeps the demo page on GitHub Pages up to date: only the table of latest rates, not the data files.
# The SQLite database travels between runs in the Actions cache; if the cache is gone,
# the sync starts from scratch and downloads the whole history again (~30 seconds).
name: dataset

on:
  schedule:
    - cron: "15 12,16,20,23 * * *" # 09:15, 13:15, 17:15 and 20:15 in Asunción (UTC-3)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download the whole BCP history"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build -o cotiza ./cmd/cotiza

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: cotiza.db
          key: cotiza-db-${{ github.run_id }}
          restore-keys: cotiza-db-

      - name: Sync
        run: ./cotiza sync --quiet ${{ inputs.full && '--full' || '' }}

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: cotiza.db
          key: cotiza-db-${{ github.run_id }}

      - name: Export
        run: ./cotiza export --page-only --dir site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
